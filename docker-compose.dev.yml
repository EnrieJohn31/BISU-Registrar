name: bisu-registrar
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "127.0.0.1:8085:8000"
    environment:
      # Let the development server answer parallel requests instead of queueing them.
      PHP_CLI_SERVER_WORKERS: "4"
    volumes:
      - ./src:/var/www/html
      # Dependencies live on Docker-native volumes. Read through the Windows bind
      # mount, they made every request take seconds (OPcache re-checks each file).
      - vendor:/var/www/html/vendor
      - node_modules:/var/www/html/node_modules
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
  node:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: npm run dev -- --host 0.0.0.0 --port 5178
    environment:
      # Windows bind mounts can miss filesystem events; poll source once a second.
      VITE_USE_POLLING: "true"
    ports:
      - "127.0.0.1:5178:5178"
    volumes:
      - ./src:/var/www/html
      - vendor:/var/www/html/vendor
      - node_modules:/var/www/html/node_modules
    depends_on:
      - app
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: bisu_registrar
      MYSQL_USER: laravel
      MYSQL_PASSWORD: laravel
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 30
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  mysql-data:
  vendor:
  node_modules:
