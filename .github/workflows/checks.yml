name: Foundation checks

on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: foundation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  foundation:
    name: Foundation checks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Check commit attribution and guard behavior
        shell: bash
        run: |
          sh .githooks/test-attribution.sh
          git log --format='Co-authored-by: %an <%ae>%n%B' HEAD | sh .githooks/check-attribution.sh

      - name: Validate Docker configuration
        run: docker compose -f docker-compose.dev.yml config --quiet

      - name: Build development runtime
        run: docker compose -f docker-compose.dev.yml build app

      - name: Prepare local environment file
        run: cp src/.env.example src/.env

      - name: Install locked PHP dependencies
        run: docker compose -f docker-compose.dev.yml run --rm --no-deps app composer install --no-interaction --prefer-dist

      - name: Validate Composer manifests
        run: docker compose -f docker-compose.dev.yml run --rm --no-deps app composer validate --strict

      - name: Generate disposable test key
        run: docker compose -f docker-compose.dev.yml run --rm --no-deps app php artisan key:generate

      - name: Install locked frontend dependencies
        run: docker compose -f docker-compose.dev.yml run --rm --no-deps app npm ci --no-audit --no-fund

      - name: Build assets and generate frontend routes
        run: docker compose -f docker-compose.dev.yml run --rm --no-deps app npm run build

      - name: Check frontend formatting and lint
        run: docker compose -f docker-compose.dev.yml run --rm --no-deps app npm run check

      - name: Check Vue TypeScript
        run: docker compose -f docker-compose.dev.yml run --rm --no-deps app npm run types:check

      - name: Check browser test TypeScript
        run: docker compose -f docker-compose.dev.yml run --rm --no-deps app npm run types:browser

      - name: Check PHP formatting, analysis and tests
        run: docker compose -f docker-compose.dev.yml run --rm --no-deps app composer test

      - name: Clean up CI containers
        if: always()
        run: docker compose -f docker-compose.dev.yml down --remove-orphans

  browser:
    name: Browser regression
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run isolated browser suite
        shell: pwsh
        run: ./browser-tests.ps1

      - name: Retain synthetic browser evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-regression
          path: .browser-artifacts/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: ignore
